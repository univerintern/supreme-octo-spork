                      <meta property="og:title" content="Univer AI" />
                          <meta property="og:description" content="Universal 3D Universe Explorer and Cross-Chain DeFi Web3 Platform with PWA support for seamless updates and real-time wallet integration." />
                              <script>
    // Gracefully filter harmless iframe proxy WebSocket and analytics connection errors
    (function() {
      var origError = console.error;
      var origWarn = console.warn;

      var shouldFilter = function(text) {
        if (!text) return false;
        var s = typeof text === 'string' ? text : String(text);
        return (
          s.indexOf('WebSocket closed without opened') !== -1 ||
          (s.indexOf('[vite]') !== -1 && s.indexOf('WebSocket') !== -1) ||
          s.indexOf('Cross-Origin-Opener-Policy') !== -1 ||
          s.indexOf('COOP') !== -1 ||
          s.indexOf('AnalyticsSDKApiError') !== -1 ||
          s.indexOf('Analytics SDK') !== -1 ||
          s.indexOf('_aistudio-iframe') !== -1 ||
          (s.indexOf('Failed to fetch') !== -1 && (s.indexOf('Analytics') !== -1 || s.indexOf('COOP') !== -1 || s.indexOf('proxy') !== -1 || s.indexOf('_aistudio') !== -1))
        );
      };

      var stringifyAll = function(args) {
        var out = '';
        for (var i = 0; i < args.length; i++) {
          var a = args[i];
          if (!a) continue;
          if (a instanceof Error) {
            out += ' ' + a.message + ' ' + (a.stack || '');
          } else if (typeof a === 'object') {
            try { out += ' ' + JSON.stringify(a); } catch(e) { out += ' ' + String(a); }
          } else {
            out += ' ' + String(a);
          }
        }
        return out;
      };

      console.error = function() {
        if (shouldFilter(stringifyAll(arguments))) return;
        origError.apply(console, arguments);
      };

      console.warn = function() {
        if (shouldFilter(stringifyAll(arguments))) return;
        origWarn.apply(console, arguments);
      };

      window.addEventListener('error', function(event) {
        var full = (event && event.message || '') + ' ' + (event && event.filename || '') + ' ' + (event && event.error && (event.error.message || '') + ' ' + (event.error.stack || ''));
        if (shouldFilter(full)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var r = event && event.reason;
        var full = '';
        if (r instanceof Error) {
          full = r.message + ' ' + (r.stack || '');
        } else if (typeof r === 'object') {
          try { full = JSON.stringify(r); } catch(e) { full = String(r); }
        } else {
          full = String(r || '');
        }
        if (r && r.context) full += ' ' + r.context;
        if (shouldFilter(full)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    })();
  </script>
